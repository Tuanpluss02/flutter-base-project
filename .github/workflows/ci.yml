name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Canonical CI Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gitleaks 8.30.1
        run: |
          GITLEAKS_VERSION="8.30.1"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Install FVM CLI
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Run Canonical CI Verification (Steps 1-9, 12, and secret scan)
        run: |
          chmod +x scripts/*.sh
          scripts/ci_local.sh

  android:
    name: Android Prod Build (Step 10)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'
          cache: true

      - name: Install FVM CLI
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Build Android App Bundle (Prod)
        run: |
          fvm flutter pub get --enforce-lockfile
          fvm flutter build appbundle --release --dart-define-from-file=config/env_prod.env

      - name: Install Gitleaks 8.30.1 for Artifact Scan
        run: |
          GITLEAKS_VERSION="8.30.1"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Unpack and Scan Android Artifact for Leaks
        run: |
          mkdir -p /tmp/unpacked-aab
          unzip -q build/app/outputs/bundle/release/app-release.aab -d /tmp/unpacked-aab || unzip -q build/app/outputs/bundle/*/*.aab -d /tmp/unpacked-aab
          gitleaks dir /tmp/unpacked-aab --redact --exit-code 1

  ios:
    name: iOS Prod Build (Step 11)
    needs: verify
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'
          cache: true

      - name: Install FVM CLI
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Build iOS Release (Prod, No Codesign)
        run: |
          fvm flutter pub get --enforce-lockfile
          fvm flutter build ios --release --no-codesign --dart-define-from-file=config/env_prod.env
